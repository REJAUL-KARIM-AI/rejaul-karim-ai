<!DOCTYPE html>
<html lang="as">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>REJAUL KARIM AI ULTRA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Arial;

background:
linear-gradient(
135deg,
#000000,
#001122,
#000814
);

color:white;

text-align:center;

overflow-x:hidden;

}

/* HOLOGRAPHIC EFFECT */

body::before{

content:"";

position:fixed;

width:100%;
height:100%;

background:
repeating-linear-gradient(

transparent 0px,

rgba(0,255,255,0.05) 2px,

transparent 4px

);

animation:
scan 8s linear infinite;

pointer-events:none;

}

@keyframes scan{

0%{
transform:translateY(-100%);
}

100%{
transform:translateY(100%);
}

}

/* SIGN OUT BUTTON */

#signOutBtn{

display:none;

position:fixed;

top:15px;
right:15px;

padding:14px 24px;

background:red;

color:white;

border:none;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

z-index:999;

box-shadow:
0 0 15px red;

}

/* CONTAINER */

.container{

padding:25px;

position:relative;

z-index:2;

}

/* AVATAR */

.avatar-box{

position:relative;

display:inline-block;

margin-top:10px;

}

.ring{

position:absolute;

top:-12px;
left:-12px;

width:264px;
height:264px;

border-radius:50%;

border:4px solid cyan;

border-top:4px solid transparent;

animation:
rotate 5s linear infinite;

box-shadow:
0 0 20px cyan;

}

@keyframes rotate{

from{
transform:rotate(0deg);
}

to{
transform:rotate(360deg);
}

}

.avatar{

width:240px;
height:240px;

border-radius:50%;

border:5px solid cyan;

object-fit:cover;

box-shadow:
0 0 20px cyan,
0 0 60px blue,
0 0 120px cyan;

animation:
pulse 2s infinite alternate;

transition:0.2s;

}

@keyframes pulse{

from{
transform:scale(1);
}

to{
transform:scale(1.04);
}

}

/* TALKING */

.talking{

animation:
talk 0.18s infinite;

}

@keyframes talk{

0%{
transform:scale(1);
}

50%{
transform:scale(1.08);
}

100%{
transform:scale(1);
}

}

/* VIDEO MODE */

.videoMode{

border:6px solid lime;

box-shadow:
0 0 40px lime,
0 0 100px cyan;

}

/* TITLE */

h1{

margin-top:20px;

font-size:50px;

color:cyan;

text-shadow:
0 0 15px cyan,
0 0 35px cyan;

}

/* TIME */

#clock{

margin-top:15px;

font-size:28px;

color:white;

text-shadow:
0 0 10px cyan;

}

/* BOX */

.box{

margin-top:25px;

padding:25px;

background:
rgba(255,255,255,0.05);

border-radius:20px;

box-shadow:
0 0 20px cyan;

}

/* INPUT */

input,select{

width:92%;

max-width:700px;

padding:18px;

margin-top:18px;

font-size:20px;

border:none;

border-radius:18px;

outline:none;

background:
rgba(255,255,255,0.1);

color:white;

box-shadow:
0 0 15px cyan;

}

/* HIDE IMAGE BUTTON */

#imageUpload{

display:none;

}

/* BUTTON */

button{

padding:16px 28px;

font-size:20px;

margin:12px;

border:none;

border-radius:18px;

background:cyan;

color:black;

font-weight:bold;

cursor:pointer;

box-shadow:
0 0 20px cyan;

transition:0.3s;

}

button:hover{

transform:scale(1.05);

}

/* ANSWER */

#answer{

margin-top:35px;

font-size:28px;

line-height:1.8;

padding:20px;

color:white;

text-shadow:
0 0 12px cyan;

min-height:160px;

}

/* CHAT AREA */

#chatArea{

display:none;

}

/* WELCOME */

#welcome{

margin-top:20px;

font-size:28px;

color:lime;

text-shadow:
0 0 15px lime;

}

/* FOOTER */

.footer{

margin-top:40px;

padding:20px;

font-size:18px;

color:#aaa;

}

</style>

</head>

<body>

<!-- SIGN OUT -->

<button
id="signOutBtn"

onclick="signOut()">

🚪 Sign Out

</button>

<div class="container">

<!-- AVATAR -->

<div class="avatar-box">

<div class="ring"></div>

<img
src="FB_IMG_1775557534194.jpg"

id="avatar"

class="avatar">

</div>

<!-- HIDDEN IMAGE -->

<input
type="file"

id="imageUpload"

accept="image/*"

onchange="changePhoto(event)">

<!-- TITLE -->

<h1>

REJAUL KARIM AI

</h1>

<!-- INDIAN TIME -->

<div id="clock"></div>

<!-- WELCOME -->

<div id="welcome"></div>

<!-- ADMIN SECURITY -->

<div class="box"
id="adminBox">

<h2>
🔐 Admin Security
</h2>

<input
type="password"

id="adminPassword"

placeholder="Enter Admin Password">

<button onclick="adminLogin()">

Admin Access

</button>

<div id="changeAdminBox"
style="display:none;">

<input
type="password"

id="newAdminPassword"

placeholder="Change Your Security Password">

<button onclick="changeAdminPassword()">

Save New Password

</button>

</div>

</div>

<!-- SIGN UP -->

<div class="box"
id="signupBox">

<h2>
🌍 Public User Sign Up
</h2>

<input
type="text"

id="signupUser"

placeholder="Create Username">

<input
type="password"

id="signupPass"

placeholder="Set Password">

<button onclick="signup()">

Sign Up

</button>

</div>

<!-- SIGN IN -->

<div class="box"
id="signinBox"

style="display:none;">

<h2>
🔑 Sign In
</h2>

<input
type="text"

id="loginUser"

placeholder="Username">

<input
type="password"

id="loginPass"

placeholder="Enter Your Password">

<button onclick="login()">

Sign In

</button>

</div>

<!-- CHAT AREA -->

<div id="chatArea">

<select id="language">

<option value="as">
অসমীয়া
</option>

<option value="bn">
বাংলা
</option>

<option value="hi">
हिन्दी
</option>

<option value="en">
English
</option>

</select>

<br>

<input
type="text"

id="question"

placeholder="Type your question here...">

<br>

<button onclick="askAI()">

💬 Text Chat

</button>

<button onclick="startVoice()">

🎤 AI Voice Chat

</button>

<button onclick="videoMode()">

🎥 Avatar Video Chat

</button>

<!-- ANSWER -->

<div id="answer">

Welcome to REJAUL KARIM AI

</div>

</div>

<!-- FOOTER -->

<div class="footer">

Powered by Gemini AI Ultra Security System

</div>

</div>

<script>

/* GEMINI API */

const API_KEY =

"AIzaSyDw8wqL1ouS8mw5HeG11uq_yUkub8h6ovo";


/* DEFAULT ADMIN PASSWORD */

if(
!localStorage.getItem(
"adminSecret"
)
){

localStorage.setItem(
"adminSecret",
"REJAUL-ADMIN-786"
);

}


/* INDIAN TIME */

setInterval(()=>{

let now = new Date();

let indianTime =

now.toLocaleString(

"en-IN",

{

timeZone:"Asia/Kolkata",

weekday:"long",

year:"numeric",

month:"long",

day:"numeric",

hour:"numeric",

minute:"numeric",

second:"numeric"

}

);

document.getElementById(
"clock"
).innerHTML =

"🇮🇳 " + indianTime;

},1000);


/* CHANGE PHOTO */

function changePhoto(event){

document.getElementById(
"avatar"
).src =

URL.createObjectURL(
event.target.files[0]
);

}


/* SHOW SIGN OUT */

function showSignOut(){

document.getElementById(
"signOutBtn"
).style.display="block";

}


/* ADMIN LOGIN */

function adminLogin(){

let pass =

document.getElementById(
"adminPassword"
).value;

if(

pass==
localStorage.getItem(
"adminSecret"
)

){

document.getElementById(
"welcome"
).innerHTML =

"👑 Welcome Admin — Active Mode Enabled";

document.getElementById(
"chatArea"
).style.display="block";

document.getElementById(
"changeAdminBox"
).style.display="block";

/* AUTO HIDE */

document.getElementById(
"adminBox"
).style.display="none";

document.getElementById(
"signupBox"
).style.display="none";

document.getElementById(
"signinBox"
).style.display="none";

/* SHOW SIGN OUT */

showSignOut();

}else{

alert(
"Wrong Admin Password"
);

}

}


/* CHANGE ADMIN PASSWORD */

function changeAdminPassword(){

let newPass =

document.getElementById(
"newAdminPassword"
).value;

if(newPass==""){

alert(
"Enter New Password"
);

return;

}

localStorage.setItem(
"adminSecret",
newPass
);

alert(
"Admin Password Changed Successfully"
);

}


/* SIGNUP */

function signup(){

let user =

document.getElementById(
"signupUser"
).value;

let pass =

document.getElementById(
"signupPass"
).value;

if(user=="" || pass==""){

alert(
"Enter Username and Password"
);

return;

}

localStorage.setItem(
"user",
user
);

localStorage.setItem(
"pass",
pass
);

alert(
"Sign Up Successful"
);

document.getElementById(
"signinBox"
).style.display="block";

}


/* LOGIN */

function login(){

let user =

document.getElementById(
"loginUser"
).value;

let pass =

document.getElementById(
"loginPass"
).value;

if(

user==
localStorage.getItem("user")

&&

pass==
localStorage.getItem("pass")

){

document.getElementById(
"welcome"
).innerHTML =

"🌍 Welcome User — Active Mode Enabled";

document.getElementById(
"chatArea"
).style.display="block";

/* AUTO HIDE */

document.getElementById(
"signupBox"
).style.display="none";

document.getElementById(
"signinBox"
).style.display="none";

document.getElementById(
"adminBox"
).style.display="none";

/* SHOW SIGN OUT */

showSignOut();

}else{

alert(
"Wrong Username or Password"
);

}

}


/* SIGN OUT */

function signOut(){

alert(
"Come back again"
);

window.close();

/* IF MOBILE BROWSER */

document.body.innerHTML =

"<h1 style='margin-top:100px;color:cyan;'>Come back again 👋</h1>";

}


/* VIDEO MODE */

function videoMode(){

let avatar =

document.getElementById(
"avatar"
);

avatar.classList.add(
"videoMode"
);

setTimeout(()=>{

avatar.classList.remove(
"videoMode"
);

},4000);

}


/* ASK AI */

async function askAI(){

let q =

document.getElementById(
"question"
).value;

if(q==""){

document.getElementById(
"answer"
).innerHTML =

"Please type your question";

return;

}

document.getElementById(
"answer"
).innerHTML =

"Thinking...";


let lang =

document.getElementById(
"language"
).value;

let prompt = "";


if(lang=="as"){

prompt =
"Reply only in Assamese language: " + q;

}

else if(lang=="bn"){

prompt =
"Reply only in Bengali language: " + q;

}

else if(lang=="hi"){

prompt =
"Reply only in Hindi language: " + q;

}

else{

prompt =
"Reply only in English language: " + q;

}


try{

const response =

await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key="

+ API_KEY,

{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

contents:[

{

parts:[

{

text:prompt

}

]

}

]

})

}

);


const data =

await response.json();

let ans =

data.candidates[0]
.content.parts[0]
.text;

document.getElementById(
"answer"
).innerHTML = ans;

speakText(ans,lang);

}catch(error){

document.getElementById(
"answer"
).innerHTML =

"Internet or API Error";

}

}


/* AI VOICE */

function speakText(text,lang){

window.speechSynthesis.cancel();

let avatar =

document.getElementById(
"avatar"
);

avatar.classList.add(
"talking"
);

avatar.classList.add(
"videoMode"
);

let speech =

new SpeechSynthesisUtterance();

speech.text = text;

speech.rate = 0.80;

speech.pitch = 0.55;

speech.volume = 1;

if(lang=="as"){

speech.lang="bn-BD";

}

else if(lang=="bn"){

speech.lang="bn-BD";

}

else if(lang=="hi"){

speech.lang="hi-IN";

}

else{

speech.lang="en-US";

}

window.speechSynthesis
.speak(speech);

speech.onend = ()=>{

avatar.classList.remove(
"talking"
);

avatar.classList.remove(
"videoMode"
);

};

}


/* VOICE INPUT */

function startVoice(){

if(
'webkitSpeechRecognition'
in window
){

let recognition =

new webkitSpeechRecognition();

recognition.lang="en-US";

recognition.start();

recognition.onresult =

function(event){

let text =

event.results[0][0]
.transcript;

document.getElementById(
"question"
).value = text;

askAI();

};

}else{

alert(
"Voice recognition not supported"
);

}

}

</script>

</body>

</html>
